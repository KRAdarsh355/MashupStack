<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <style>
        body{
            background-color: bisque;
        }
        h1{
            color:rgb(116, 116, 253);
        }
    </style>
</head>

<body>
    
    <div class="container-fluid">
        <h1 class="display-1 text-center font-weight-bold font-italic bg-danger">Calculator</h1>
        <div class="form-group">
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <label for="num1">Enter first number:</label>
                    <input type="text" class="form-control" id="num1" placeholder="Enter number">
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <label for="num2">Enter second number:</label>
                    <input type="text" class="form-control" id="num2" placeholder="Enter number">
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <div class="form-group">
                        <label for="op">Select operator:</label>
                        <select class="form-control" id="op">
                            <option>+</option>
                            <option>-</option>
                            <option>*</option>
                            <option>/</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <button type="button" class="btn btn-danger mt-3 text-light" id="equal">=</button>
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5 mt-3">
                    <p id="result" class="font-italic font-weight-bolder"></p>
                </div>
            </div>
        </div>
    </div>
    <script>
        let result
        function add(a,b){
            return a+b
        }
        function subtract(a,b){
            return a-b
        }
        function multiply(a,b){
            return a*b
        }
        function divide(a,b){
            return a/b
        }
        function print(value){
            if(typeof(value)==="number"){
                document.getElementById("result").innerHTML=value.toFixed(2)
            }
            else{
                document.getElementById("result").innerHTML=value

            }
        }
        document.getElementById("equal").addEventListener("click",function(){
            let num1=Number(document.getElementById("num1").value)
            let num2=Number(document.getElementById("num2").value)
            let operator=document.getElementById("op").value
            if(isNaN(num1)||isNaN(num2)){
                result= "Please enter valid numbers."
            }
            else if(operator==="/" && num2===0){
                result= "Cannot divide by zero"
            }
            // else if(operator==="+"){
            //     result=add(num1,num2)
            // }
            // else if(operator==="-"){
            //     result=subtract(num1,num2)
            // }
            // else if(operator==="*"){
            //     result=multiply(num1,num2)
            // }
            // else if(operator==="/"){
            //     result=divide(num1,num2)
            // }
            else {
                switch(operator){
                    case "+":
                        result=add(num1,num2)
                        break
                    case "-":
                        result=subtract(num1,num2)
                        break
                    case "*":
                        result=multiply(num1,num2)
                        break
                    case "/":
                        result=divide(num1,num2)
                        break
                }
            }
            print(result)
            })
    </script>
</body>
</html>
