<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <style>
        body{
            background-color: bisque;
        }
        h1{
            color:rgb(116, 116, 253);
        }
    </style>
</head>

<body>
    
    <div class="container-fluid">
        <h1 class="display-1 text-center font-weight-bold font-italic bg-danger">Calculator</h1>
        <div class="form-group">
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <label for="num1">Enter first number:</label>
                    <input type="text" class="form-control" id="num1" placeholder="Enter number">
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <label for="num2">Enter second number:</label>
                    <input type="text" class="form-control" id="num2" placeholder="Enter number">
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <div class ="dropdown mt-3">
                        <button type="button" class="btn btn-danger dropdown-toggle" data-toggle="dropdown">Operators</button>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="#" id="add">+</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#" id="sub">-</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#" id="mult">*</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#" id="divi">/</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5">
                    <button type="button" class="btn btn-danger mt-3 text-light" id="equal">=</button>
                </div>
            </div>
            <div class="row pl-md-5 justify-content-center">
                <div class="col-md-5 mt-3">
                    <input type="text" class="form-control" placeholder="Result" id="result">
                </div>
            </div>
        </div>
    </div>
    <script>
        let operator=""
        let result
        function add(a,b){
            return a+b
        }
        function subtract(a,b){
            return a-b
        }
        function multiply(a,b){
            return a*b
        }
        function divide(a,b){
            return a/b
        }
        function print(value){
            document.getElementById("result").value=value;
        }
        document.getElementById("add").addEventListener("click",function(){
            operator="+"
        })
        document.getElementById("sub").addEventListener("click",function(){
            operator="-"
        })
        document.getElementById("mult").addEventListener("click",function(){
            operator="*"
        })
        document.getElementById("divi").addEventListener("click",function(){
            operator="/"
        })
        document.getElementById("equal").addEventListener("click",function(){
            let num1=Number(document.getElementById("num1").value)
            let num2=Number(document.getElementById("num2").value)
            if(operator==="+"){
            result=add(num1,num2)
        }
        else if(operator==="-"){
            result=subtract(num1,num2)
        }
        else if(operator==="*"){
            result=multiply(num1,num2)
        }
        else if(operator==="/"){
            result=divide(num1,num2)
        }
        print(result)
        })
        
    </script>
</body>
</html>
