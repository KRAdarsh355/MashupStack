<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice3</title>
</head>
<body>
    <p>Finding the squareroot of a number</p>
    <p id="num"></p>
    <script>
        let a=parseInt(prompt("Find squareroot of a number:"))
        let root=Math.sqrt(a)
        document.getElementById("num").innerHTML=root
    </script>
</body>
</html>
