<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kilometers to miles</title>
</head>
<body>
    <script>
        const factor=0.621271
        let km=prompt("Enter value in kilometers:")
        let result=km*factor
        console.log(`${km} in miles = ${result}`);
        

    </script>
</body>
</html>
