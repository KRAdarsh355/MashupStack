<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic problem</title>
</head>
<body>
    <script>
        let root1,root2
        let a=prompt("Enter first number:")
        let b=prompt("Enter second number:")
        let c=prompt("Enter third number:")
        let disc=Math.sqrt(b*b-4*a*c)
        if (disc>0){
            root1=(-b+disc)/(2*a)
            root2=(-b-disc)/(2*a)
            console.log(`The roots of quadratic equation are ${root1} and ${root2}`)
        }
        else if(disc<0){
            let real=(-b/(2*a)).toFixed(2)
            let imag=-disc/(2*a).toFixed(2)
            console.log(`The roots of quadratic equation are ${real}+${imag} and ${real}-${imag}`)            
        }
        else{
            root1=root2= -b/(2*a)
            console.log(`The roots of quadratic equation are ${root1} and ${root2}`)

        }

    </script>
</body>
</html>
