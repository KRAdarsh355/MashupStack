<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Game</title>
</head>
<body>
    <h1>GuessGame</h1>
    <p id="helper1"></p>
    <p id="helper2"></p>
    <p id="helper3"></p>

    <script>
        let i=0
        while(i<5){
            let num=parseInt(prompt("Enter a number between 1 and 5:"))
            if (num<1 || num>5){
                document.getElementById("helper1").innerHTML = "Invalid input";
                continue;
            }
            switch(num){
                case 1:
                    document.getElementById("helper2").innerHTML="One";
                    break;
                case 2:
                    document.getElementById("helper2").innerHTML="Two";
                    break;
                case 3:
                    document.getElementById("helper2").innerHTML="Three";
                    break;
                case 4:
                    document.getElementById("helper2").innerHTML="Four";
                    break;
                case 5:
                    document.getElementById("helper2").innerHTML="Five";
                    break;
            }
            if (num==3){
                document.getElementById("helper1").innerHTML="You guessed it right!";
                break;
            }
            else{
                document.getElementById("helper1").innerHTML="Wrong guess.Try again.";
            }
            i++;
        }
        if(i==5){
            document.getElementById("helper3").innerHTML="All chances are used.";

        }
    </script>
</body>
</html>
