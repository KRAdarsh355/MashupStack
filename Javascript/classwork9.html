<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment System</title>
</head>
<body>
    <p> "My son is 12 years old. Our flat number is 45 and contact is 9876543210."</p>
    <p id="numbers"></p>
    <p>Are there numbers present in the string?</p>
    <p id="present"></p>
    <script>
        let str= "My son is 12 years old. Our flat number is 45 and contact is 9876543210."
        let nums=/[0-9]/g
        let result=str.replace(nums,"NUMBER ")
        document.getElementById("numbers").innerHTML=result
        document.getElementById("present").innerHTML=/[0-9]/.test(str)


    </script>
</body>
</html>
