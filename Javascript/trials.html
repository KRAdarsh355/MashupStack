<!DOCTYPE html>
<html>
<head>
  <title>Change Image Example</title>
</head>
<body>
  <img id="myImage" src="https://a-z-animals.com/media/2022/09/shutterstock_2118427715-1024x711.jpg" width="200" height="200">
  <button onclick="changeImage()">Change Image</button>
  <script>
    function changeImage() {
      document.getElementById("myImage").src = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcToNRDU9KYnAwlNsJvii7njscMkZtXd9i8wkg&s";
    }
  </script>
</body>
</html>
